spring:
  application:
    name: compilador-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:presupuestos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:presupuestoUser}
    password: ${DB_PASSWORD:Presupuesto00$}
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.compiladores.api: INFO

application:
  name: Compilador SQL API
  description: API REST base para el proyecto final de compiladores
  sql:
    max-rows: ${SQL_MAX_ROWS:100}
